<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Завдання 2. Закодоване зображення</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#fbf6ea;--sheet:#fffdf7;--ink:#3a2f33;--pink:#e8577a;--pinkd:#c93a5f;--line:#f2b5c4;--soft:#fde8ee;--paint:#ffc9b8;--paintd:#ff9d86;--bad:#ffdfe5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#2a2326;--sheet:#352c30;--ink:#f6ecee;--line:#7a4556;--soft:#4a3039;--paint:#d98672;--paintd:#ff9d86;--bad:#5a2c38}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Nunito','Trebuchet MS',Arial,sans-serif;min-height:100vh}
.page{max-width:980px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:clamp(18px,3vw,26px);font-weight:900;margin:0 0 14px;padding-bottom:10px;border-bottom:3px solid var(--line);line-height:1.2}
h1 span{color:var(--pink)}
.task{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.num{flex:none;width:44px;height:44px;border-radius:50%;background:var(--pink);color:#fff;font-weight:900;font-size:26px;display:grid;place-items:center}
.task p{margin:0;font-size:clamp(17px,2.6vw,23px);font-weight:800}
.task b{color:var(--pinkd)}
.note{margin:0 0 12px;font-weight:700;font-size:17px;background:var(--soft);border:2px dashed var(--line);border-radius:12px;padding:8px 12px}
.stats{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;font-weight:800;font-size:18px;margin-bottom:10px}
.bar{flex:1;min-width:140px;height:16px;background:var(--soft);border:2px solid var(--line);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--pink);transition:width .3s}
#grid{display:grid;grid-template-columns:repeat(17,1fr);border-top:2px solid var(--line);border-left:2px solid var(--line);background:var(--sheet);border-radius:4px}
.cell{aspect-ratio:1;min-width:0;padding:0;font:900 clamp(10px,2.5vw,22px)/1 'Nunito','Trebuchet MS',sans-serif;color:var(--ink);background:transparent;border:0;border-right:2px solid var(--line);border-bottom:2px solid var(--line);cursor:pointer;transition:background .2s,color .4s,transform .15s;-webkit-tap-highlight-color:transparent}
.cell:hover{background:var(--soft)}
.cell.on{background:var(--paint);animation:pop .25s}
.cell.shake{animation:shake .4s;background:var(--bad)}
.solved .cell{cursor:default}
.solved .cell:not(.on){color:transparent}
.solved .cell.on{background:var(--paintd);color:transparent}
#msg{min-height:40px;margin:12px 0 4px;font-size:clamp(18px,2.8vw,24px);font-weight:900;color:var(--pinkd)}
#msg.win{color:#2f9e55}
.btns{display:flex;gap:10px;flex-wrap:wrap}
button.b{font:900 19px 'Nunito','Trebuchet MS',sans-serif;border:0;border-radius:12px;padding:12px 22px;background:var(--pink);color:#fff;cursor:pointer;box-shadow:0 4px 0 var(--pinkd)}
button.b:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pinkd)}
button.ghost{background:var(--sheet);color:var(--pinkd);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.conf{position:fixed;top:-30px;z-index:50;pointer-events:none;font-size:26px;animation:fall 3s linear forwards}
@keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-3px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(500deg)}}
</style>
</head>
<body>
<main class="page">
<h1><span>УРОК 16.</span> Як записати числами будь-яку інформацію</h1>
<div class="task"><div class="num">2</div><p>Зафарбуй <b>лише</b> квадратики з <b>двоцифровими</b> числами і дізнайся, яке зображення закодовано.</p></div>
<p class="note">💡 Двоцифрове число має дві цифри. Наприклад: 7 — одна цифра, а 42 — дві цифри.</p>
<div class="stats">
<div>Зафарбовано: <b id="cnt">0</b> із <span id="tot"></span></div>
<div class="bar"><i id="fill"></i></div>
<div><b id="pct">0</b>%</div>
</div>
<div id="grid" role="grid" aria-label="Таблиця з числами"></div>
<div id="msg"></div>
<div class="btns"><button class="b" id="check">✔ Перевірити</button><button class="b ghost" id="reset">↺ Почати спочатку</button></div>
</main>
<script>
// Числа таблиці (11 рядків × 17 стовпців) — не змінювати
const numbers = [
    [23, 54, 67, 8, 6, 3, 2, 7, 7, 5, 12, 77, 94, 34, 64, 1, 2],
    [0, 11, 72, 1, 2, 83, 24, 61, 3, 66, 42, 3, 9, 4, 7, 5, 3],
    [1, 4, 5, 9, 12, 88, 93, 47, 21, 6, 2, 5, 6, 1, 8, 83, 90],
    [89, 6, 2, 95, 52, 57, 38, 84, 72, 12, 9, 83, 19, 63, 49, 25, 12],
    [94, 12, 7, 44, 95, 64, 37, 83, 28, 72, 0, 4, 7, 9, 34, 72, 32],
    [3, 8, 1, 64, 94, 23, 55, 32, 93, 32, 9, 1, 9, 8, 9, 6, 1],
    [9, 5, 9, 23, 26, 62, 46, 53, 55, 3, 8, 27, 0, 4, 2, 7, 5],
    [0, 4, 8, 9, 66, 67, 37, 72, 4, 5, 62, 80, 13, 67, 3, 1, 4],
    [2, 6, 84, 19, 0, 8, 3, 7, 62, 9, 3, 8, 25, 94, 21, 49, 11],
    [3, 37, 87, 4, 8, 55, 2, 1, 15, 82, 5, 2, 6, 33, 75, 45, 31],
    [87, 65, 42, 1, 93, 18, 4, 6, 36, 50, 42, 7, 0, 4, 72, 94, 47]
];
const $ = id => document.getElementById(id);
const isTwoDigit = n => n >= 10 && n <= 99;
let total = 0, finished = false, msgTimer;

function say(text, win) {
  const m = $('msg');
  m.textContent = text;
  m.className = win ? 'win' : '';
  clearTimeout(msgTimer);
  if (text && !win) msgTimer = setTimeout(() => { m.textContent = ''; }, 2500);
}

function update() {
  const count = document.querySelectorAll('.cell.on').length;
  $('cnt').textContent = count;
  $('pct').textContent = Math.round(count / total * 100);
  $('fill').style.width = (count / total * 100) + '%';
  return count;
}

function build() {
  const grid = $('grid');
  grid.innerHTML = '';
  grid.classList.remove('solved');
  finished = false;
  total = 0;
  for (let r = 0; r < numbers.length; r++) {
    for (let c = 0; c < numbers[r].length; c++) {
      const n = numbers[r][c];
      if (isTwoDigit(n)) total++;
      const cell = document.createElement('button');
      cell.className = 'cell';
      cell.textContent = n;
      cell.addEventListener('click', () => tap(cell, n));
      grid.appendChild(cell);
    }
  }
  $('tot').textContent = total;
  update();
  say('');
}

function tap(cell, n) {
  if (finished) return;
  if (isTwoDigit(n)) {
    cell.classList.toggle('on');
    update();
  } else {
    cell.classList.remove('shake');
    void cell.offsetWidth;
    cell.classList.add('shake');
    setTimeout(() => cell.classList.remove('shake'), 450);
    say('Тут одноцифрове число. Спробуй іншу клітинку!');
  }
}

function celebrate() {
  const em = ['🎉', '⭐', '✨', '🌸', '💖'];
  for (let i = 0; i < 40; i++) {
    const c = document.createElement('span');
    c.className = 'conf';
    c.textContent = em[i % em.length];
    c.style.left = Math.random() * 100 + 'vw';
    c.style.animationDelay = Math.random() * 1.2 + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4800);
  }
}

$('check').onclick = () => {
  if (finished) return;
  const ok = update() === total;
  if (ok) {
    finished = true;
    $('grid').classList.add('solved');
    say('Чудова робота! Ти розгадав секретне зображення!', true);
    celebrate();
  } else {
    say('Ще не все готово! Перевір уважніше');
  }
};
$('reset').onclick = build;
build();
</script>
</body>
</html>
